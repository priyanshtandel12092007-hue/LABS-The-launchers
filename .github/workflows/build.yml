name: Build LABS Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -oq "*.zip" < /dev/null
          fi
          if [ ! -f "./build.gradle" ] && [ ! -f "./build.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" \) -not -path "*/app/*" -printf "%h\n" | head -n 1)
            if [ -n "$SUBDIR" ]; then
              cp -rn "$SUBDIR"/. .
            fi
          fi

      - name: Generate placeholder google-services.json if missing
        run: |
          if [ ! -f "app/google-services.json" ]; then
            PKG=$(grep -E "applicationId" app/build.gradle* | head -n 1 | sed -E 's/.*applicationId[[:space:]=]+["'\'']([^"'\'']+)["'\''].*/\1/')
            PKG=${PKG:-"com.labs.launcher"}
            cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "labs-launcher-placeholder",
              "storage_bucket": "labs-launcher-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "$PKG"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForLocalBuildOnly000000000"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate debug.keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload LABS APK
        uses: actions/upload-artifact@v4
        with:
          name: LABS-Launcher-APK
          path: app/build/outputs/apk/debug/*.apk
