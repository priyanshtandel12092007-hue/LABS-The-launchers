name: Build LABS Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o "*.zip"
          fi
          # If gradlew is inside a subfolder, move everything to the root
          if [ ! -f "./gradlew" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "gradlew" -printf "%h\n" | head -n 1)
            if [ -n "$SUBDIR" ]; then
              cp -rn "$SUBDIR"/. .
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload LABS APK
        uses: actions/upload-artifact@v4
        with:
          name: LABS-Launcher-APK
          path: app/build/outputs/apk/debug/*.apk
