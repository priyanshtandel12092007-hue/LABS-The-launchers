name: Build LABS Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o "*.zip"
          fi
          # Locate build.gradle or build.gradle.kts if nested inside a subfolder
          if [ ! -f "./build.gradle" ] && [ ! -f "./build.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" \) -not -path "*/app/*" -printf "%h\n" | head -n 1)
            if [ -n "$SUBDIR" ]; then
              cp -rn "$SUBDIR"/. .
            fi
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload LABS APK
        uses: actions/upload-artifact@v4
        with:
          name: LABS-Launcher-APK
          path: app/build/outputs/apk/debug/*.apk
